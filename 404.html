<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SamaSight has moved to samasight.org</title>
<link rel="canonical" href="https://samasight.org/">
<script>
  // The old GitHub Pages address (kumarumang2611.github.io/vision-therapy-app)
  // forwards to samasight.org, keeping the page, query and in-app route (#/…).
  // GitHub Pages can't send real HTTP redirects, so this page (also served as
  // 404.html for every other path) does it in the browser. ADR-042.
  (function () {
    var prefix = '/vision-therapy-app';
    var path = location.pathname;
    if (path.indexOf(prefix) === 0) path = path.slice(prefix.length);
    if (path === '' || path === '/index.html' || path === '/404.html') path = '/';
    location.replace('https://samasight.org' + path + location.search + location.hash);
  })();
</script>
<meta http-equiv="refresh" content="0; url=https://samasight.org/">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #05050a; color: #e8e8f0; font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 20px; }
  a { color: #e94560; }
</style>
</head>
<body>
  <p>SamaSight has moved to <a href="https://samasight.org/">samasight.org</a>.</p>
</body>
</html>
