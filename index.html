<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signing in… — SamaSight</title>
  <style>
    body { background: #05050a; color: #fff; font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
    .card { background: #0a0a14; padding: 40px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); max-width: 400px; width: 90%; }
    h1 { font-size: 20px; letter-spacing: 2px; margin: 0 0 12px; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
    .loader { width: 40px; height: 40px; border: 3px solid rgba(233,69,96,0.1); border-top-color: #e94560; border-radius: 50%; margin: 0 auto; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    button { background: #e94560; color: #fff; border: none; border-radius: 10px; padding: 12px 20px; font-weight: bold; cursor: pointer; display: none; margin: 0 auto; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">AUTHENTICATING…</h1>
    <p id="msg">Redirecting you back to SamaSight.</p>
    <div class="loader" id="loader"></div>
    <button id="retry">OPEN SAMASIGHT</button>
  </div>
  <script>
    var hash = window.location.hash || '';
    var search = window.location.search || '';
    if (!hash && !search) {
      document.getElementById('title').textContent = 'NO TOKENS FOUND';
      document.getElementById('msg').textContent = 'Try signing in again from the desktop app.';
      document.getElementById('loader').style.display = 'none';
    } else {
      // NOTE: Using the new samasight:// custom protocol
      var deepLink = 'samasight://auth-callback' + hash + search;
      function go() { window.location.href = deepLink; }
      go();
      
      // Show fallback button if OS suppresses the redirect prompt
      setTimeout(function() {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('msg').textContent = 'If the app didn\'t open automatically, click below.';
        var btn = document.getElementById('retry');
        btn.style.display = 'inline-block';
        btn.onclick = go;
      }, 2500);
    }
  </script>
</body>
</html>
